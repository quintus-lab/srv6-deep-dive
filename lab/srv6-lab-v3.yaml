annotations: []
smart_annotations: []
nodes:
  - boot_disk_size: null
    configuration:
      - name: first-boot.cfg
        content: |-
          !
          hostname PE1
          username cisco
           group root-lr
           group cisco-support
           secret 0 CHANGE-ME
          !
          cdp
          vrf RED
           address-family ipv4 unicast
            import route-target
             65000:200
            !
            export route-target
             65000:200
            !
           !
           address-family ipv6 unicast
            import route-target
             65000:200
            !
            export route-target
             65000:200
            !
           !
          !
          vrf BLUE
           address-family ipv4 unicast
            import route-target
             65000:100
            !
            export route-target
             65000:100
            !
           !
           address-family ipv6 unicast
            import route-target
             65000:100
            !
            export route-target
             65000:100
            !
           !
          !
          interface Loopback0
           description router-id and SRv6 encapsulation source
           ipv6 address 2001:db8:100::1/128
          !
          interface Loopback101
           description BLUE tenant endpoint
           vrf BLUE
           ipv4 address 10.100.1.1 255.255.255.255
           ipv6 address 2001:db8:a:101::1/128
          !
          interface Loopback201
           description RED tenant endpoint
           vrf RED
           ipv4 address 10.200.1.1 255.255.255.255
           ipv6 address 2001:db8:a:201::1/128
          !
          interface MgmtEth0/RP0/CPU0/0
           shutdown
          !
          interface GigabitEthernet0/0/0/0
           description TO-P2 cost 10
           cdp
           ipv6 address 2001:db8:200:12::/127
          !
          interface GigabitEthernet0/0/0/1
           description TO-P3 cost 40
           cdp
           ipv6 address 2001:db8:200:13::/127
          !
          interface GigabitEthernet0/0/0/2
           description TO-CE BLUE
           vrf BLUE
           ipv4 address 10.1.1.1 255.255.255.0
           ipv6 address 2001:db8:c:101::1/64
           no shutdown
          !
          interface GigabitEthernet0/0/0/3
           description TO-CE RED
           vrf RED
           ipv4 address 10.2.1.1 255.255.255.0
           ipv6 address 2001:db8:c:201::1/64
           no shutdown
          !
          interface GigabitEthernet0/0/0/4
           description TO-CE L2 attachment circuit
           no shutdown
          !
          router isis CORE
           is-type level-2-only
           net 49.0001.0000.0000.0001.00
           log adjacency changes
           address-family ipv6 unicast
            metric-style wide
            fast-reroute per-prefix tiebreaker node-protecting index 100
            microloop avoidance segment-routing
            segment-routing srv6
             locator MAIN
             !
             locator FA128
             !
            !
           !
           flex-algo 128
            priority 200
            metric-type delay
            advertise-definition
           !
           interface Loopback0
            passive
            address-family ipv6 unicast
            !
           !
           interface GigabitEthernet0/0/0/0
            bfd minimum-interval 100
            bfd multiplier 3
            bfd fast-detect ipv6
            point-to-point
            address-family ipv6 unicast
             fast-reroute per-prefix
             fast-reroute per-prefix ti-lfa
             metric 10
            !
           !
           interface GigabitEthernet0/0/0/1
            bfd minimum-interval 100
            bfd multiplier 3
            bfd fast-detect ipv6
            point-to-point
            address-family ipv6 unicast
             fast-reroute per-prefix
             fast-reroute per-prefix ti-lfa
             metric 40
            !
           !
          !
          router bgp 65000
           bgp router-id 10.0.0.1
           address-family vpnv4 unicast
           !
           address-family vpnv6 unicast
           !
           neighbor 2001:db8:100::6
            remote-as 65000
            update-source Loopback0
            address-family vpnv4 unicast
            !
            address-family vpnv6 unicast
            !
           !
           vrf RED
            rd 65000:201
            address-family ipv4 unicast
             segment-routing srv6
              locator MAIN
              alloc mode per-vrf
             !
             redistribute connected
            !
            address-family ipv6 unicast
             segment-routing srv6
              locator MAIN
              alloc mode per-vrf
             !
             redistribute connected
            !
           !
           vrf BLUE
            rd 65000:101
            address-family ipv4 unicast
             segment-routing srv6
              locator MAIN
              alloc mode per-vrf
             !
             redistribute connected
            !
            address-family ipv6 unicast
             segment-routing srv6
              locator MAIN
              alloc mode per-vrf
             !
             redistribute connected
            !
           !
          !
          segment-routing
           traffic-eng
            segment-lists
             srv6
              sid-format usid-f3216
             !
             segment-list TWO-BLOCKS
              srv6
               index 10 sid fcbb:bb01:3::
               index 20 sid fcbb:bb01:5::
               index 30 sid fcbb:bb00:6::
              !
             !
             segment-list VIA-P3-P5-UN
              srv6
               index 10 sid fcbb:bb00:3::
               index 20 sid fcbb:bb00:5::
               index 30 sid fcbb:bb00:6::
              !
             !
            !
            on-demand color 200
             srv6
              binding-sid dynamic behavior ub6-insert-reduced locator FA128
             !
             dynamic
              pcep
              !
              metric
               type latency
              !
             !
            !
            policy BLUE-C100
             srv6
              binding-sid dynamic behavior ub6-insert-reduced locator MAIN
             !
             color 100 end-point ipv6 2001:db8:100::6
             candidate-paths
              preference 100
               explicit segment-list VIA-P3-P5-UN
               !
              !
             !
            !
            policy BLUE6-C300
             srv6
              binding-sid dynamic behavior ub6-insert-reduced locator MAIN
             !
             color 300 end-point ipv6 2001:db8:100::6
             candidate-paths
              preference 100
               explicit segment-list TWO-BLOCKS
               !
              !
             !
            !
            pcc
             source-address ipv6 2001:db8:100::1
             pce address ipv6 2001:db8:100::4
             !
            !
           !
           srv6
            encapsulation
             source-address 2001:db8:100::1
            !
            locators
             locator MAIN
              micro-segment behavior unode psp-usd
              prefix fcbb:bb00:1::/48
             !
             locator FA128
              micro-segment behavior unode psp-usd
              prefix fcbb:bb01:1::/48
              algorithm 128
             !
            !
           !
          !
          lldp
          !
          performance-measurement
           interface GigabitEthernet0/0/0/0
            delay-measurement
             advertise-delay 5000
            !
           !
           interface GigabitEthernet0/0/0/1
            delay-measurement
             advertise-delay 1000
            !
           !
          !
          end
      - name: xrd.env
        content: |-
          XR_VROUTER_DP_HUGEPAGE_MB=1024
          XR_VROUTER_DP_MAIN_TUNE=100,250,500,80,100
